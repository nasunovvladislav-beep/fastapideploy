name: Deploy FastAPI to Server

on:
  push:
    branches: [ "main" ] # Срабатывает при пуше в main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: vladislavich96/fastapi-app:latest # Замените на ваш тег образа

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/fastapi-app
            # Скачать последний образ
            docker compose pull
            # Перезапустить сервис (автоматически удалит старый контейнер)
            docker compose up -d --remove-orphans
            # Опционально: очистить неиспользуемые старые образы
            docker image prune -f